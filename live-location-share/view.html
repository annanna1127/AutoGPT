<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>現在地（共有）</title>
  <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
  <link rel="stylesheet" href="styles.css" />
  <style>
    html, body { height: 100%; }
    #map { position: absolute; inset: 0; z-index: 1; }
    .overlay {
      position: absolute; z-index: 2; left: 12px; right: 12px; top: 12px;
      max-width: 560px; margin: 0 auto;
      background: var(--card); border: 1px solid var(--line);
      border-radius: 12px; padding: 12px 14px;
      box-shadow: 0 6px 24px rgba(0,0,0,.2);
    }
    .overlay .who { font-weight: 700; font-size: 1.05rem; }
    .overlay .sub2 { color: var(--muted); font-size: .85rem; margin-top: 2px; }
    .ended { color: var(--danger); font-weight: 700; }
  </style>
</head>
<body>
  <div id="map"></div>
  <div class="overlay">
    <div class="who" id="who">読み込み中…</div>
    <div class="sub2" id="sub">共有リンクを確認しています</div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
  <script src="view.js"></script>
</body>
</html>
